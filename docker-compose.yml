services:
  db:
    image: postgres:16-alpine
    container_name: dardania-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dardania
      POSTGRES_PASSWORD: dardania
      POSTGRES_DB: dardania
    ports:
      - "5433:5432"
    volumes:
      - dardania-pgdata:/var/lib/postgresql/data
volumes:
  dardania-pgdata:
