services:
  db:
    image: postgres:16-alpine
    container_name: carshia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: carshia
      POSTGRES_PASSWORD: carshia
      POSTGRES_DB: carshia
    ports:
      - "5433:5432"
    volumes:
      - carshia-pgdata:/var/lib/postgresql/data
volumes:
  carshia-pgdata:
